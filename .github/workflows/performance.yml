name: Performance

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to measure (all for the full matrix)
        type: choice
        default: all
        options: [all, unary-light, unary-cpu, unary-io, server-streaming, bidi]
      initialize_baseline:
        description: Create missing baselines on this runner
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: performance
  cancel-in-progress: false

jobs:
  benchmark:
    if: ${{ github.ref == 'refs/heads/main' && vars.BENCH_RUNNER_LABEL != '' }}
    runs-on: [self-hosted, Linux, '${{ vars.BENCH_RUNNER_LABEL }}']
    timeout-minutes: 60
    env:
      BUNDLE_GEMFILE: bench/Gemfile
      BENCH_RUNNER_ID: '${{ vars.BENCH_RUNNER_LABEL }}'
      BASELINE_DIRECTORY: '${{ vars.BENCH_BASELINE_DIRECTORY }}'
      SCENARIO: '${{ inputs.scenario || ''all'' }}'
      INITIALIZE_BASELINE: '${{ inputs.initialize_baseline }}'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify fixed runner prerequisites
        run: |
          test -n "$BASELINE_DIRECTORY"
          ruby -e 'abort "Ruby 3.4 is required" unless RUBY_VERSION.start_with?("3.4.")'
          ghz --version
          test "$(ghz --version 2>&1)" = 'v0.121.0'
          test "$(cat /sys/fs/cgroup/cpu.max)" = '200000 100000'
          test "$(cat /sys/fs/cgroup/memory.max)" = '1073741824'
      - name: Install benchmark bundle
        run: bundle install
      - name: Measure and reject regressions
        run: |
          mkdir -p tmp/performance
          failed=0
          for adapter in native async; do
            for scenario in unary-light unary-cpu unary-io server-streaming bidi; do
              if [ "$SCENARIO" != all ] && [ "$SCENARIO" != "$scenario" ]; then continue; fi
              baseline="$BASELINE_DIRECTORY/$adapter-$scenario.json"
              if [ ! -f "$baseline" ] && [ "$INITIALIZE_BASELINE" != true ]; then
                echo "Missing reviewed baseline: $baseline" >&2
                failed=1
                continue
              fi
              if ! bundle exec ruby bin/bench "$scenario" --transport "$adapter" \
                --output "tmp/performance/$adapter-$scenario.json"; then
                failed=1
                continue
              fi
              if [ -f "$baseline" ]; then
                if ! ruby bench/compare.rb "$baseline" "tmp/performance/$adapter-$scenario.json"; then failed=1; fi
              else
                cp "tmp/performance/$adapter-$scenario.json" "$baseline"
              fi
            done
          done
          test "$failed" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.sha }}
          path: tmp/performance/
          if-no-files-found: error
