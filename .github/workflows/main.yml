name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / grpc ${{ matrix.grpc }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
        grpc: ['= 1.83.0', '>= 1.83.0']

    env:
      GRPC_VERSION: ${{ matrix.grpc }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        env:
          COVERAGE: '1'
        run: bundle exec rake
      - name: Lint
        run: bundle exec rubocop
      - name: Dependency audit
        run: bundle exec bundler-audit check --update
      - name: Build packages
        run: bundle exec rake build
      - name: Benchmark smoke
        if: matrix.ruby == '3.4'
        run: |
          version=$(awk '$1 == "ghz" { print $2 }' .devcontainer/tool-versions)
          curl -fLO "https://github.com/bojand/ghz/releases/download/v$version/ghz-linux-x86_64.tar.gz"
          curl -fLO "https://github.com/bojand/ghz/releases/download/v$version/ghz-linux-x86_64.tar.gz.sha256"
          expected=$(awk '{print $1}' ghz-linux-x86_64.tar.gz.sha256)
          printf '%s  %s\n' "$expected" ghz-linux-x86_64.tar.gz | sha256sum -c -
          tar -xzf ghz-linux-x86_64.tar.gz ghz
          for scenario in unary-light unary-cpu unary-io server-streaming bidi; do
            bundle exec ruby bin/bench "$scenario" --smoke --ghz ./ghz --output "tmp/$scenario.json"
          done
