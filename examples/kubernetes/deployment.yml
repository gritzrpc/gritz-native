apiVersion: apps/v1
kind: Deployment
metadata:
  name: gritz
spec:
  replicas: 2
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gritz
  template:
    metadata:
      labels:
        app: gritz
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_migrate_req
            value: "1"
      containers:
        - name: gritz
          image: gritz-phase3-e2e:local
          imagePullPolicy: Never
          env:
            - name: REVISION
              value: a
          ports:
            - name: grpc
              containerPort: 50051
            - name: admin
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: gritz
spec:
  selector:
    app: gritz
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
